<div class="shell">
  <header class="shell__header">
    <a class="brand" routerLink="/journey" aria-label="Our Journey, mapa">
      <img class="brand__logo" src="assets/logojourney-cadetblue.png" alt="" />
      <span class="brand__name">Our Journey</span>
    </a>

    <div class="header-actions">
      <a class="admin-link" routerLink="/admin" routerLinkActive="is-active">Administrar</a>
      <button class="sign-out" type="button" aria-label="Cerrar sesión" (click)="signOut()">
        <span class="sign-out__short">Salir</span>
        <span class="sign-out__full">Cerrar sesión</span>
      </button>
    </div>
  </header>

  @if (signOutError()) {
    <p class="session-error" role="alert">{{ signOutError() }}</p>
  }

  <main class="shell__content">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a
      routerLink="/journey"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="nav-symbol nav-symbol--map" aria-hidden="true"></span>
      <span>Mapa</span>
    </a>
    <a routerLink="/memories" routerLinkActive="is-active">
      <span class="nav-symbol nav-symbol--memory" aria-hidden="true"></span>
      <span>Recuerdos</span>
    </a>
    <a routerLink="/trips" routerLinkActive="is-active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 7V5.75A1.75 1.75 0 0 1 10.75 4h2.5A1.75 1.75 0 0 1 15 5.75V7" />
        <rect x="3.5" y="7" width="17" height="12.5" rx="2.25" />
        <path d="M3.5 12h17M8 10.75v2.5M16 10.75v2.5" />
      </svg>
      <span>Viajes</span>
    </a>
    <a routerLink="/timeline" routerLinkActive="is-active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="2.75" />
        <circle cx="16.5" cy="9" r="2.1" />
        <path d="M3.75 19a5.25 5.25 0 0 1 10.5 0M14.25 15.25A4.25 4.25 0 0 1 20.25 19" />
      </svg>
      <span>Nosotros</span>
    </a>
  </nav>
</div>
